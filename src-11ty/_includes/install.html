---
layout: base.html
---

<style>
  .details-page {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    color: var(--wa-color-brand-50);
    text-decoration: none;
    font-size: 0.95rem;
    margin-bottom: 20px;
    transition: opacity 0.2s;
  }

  .back-link:hover {
    opacity: 0.8;
  }

  .back-link::before {
    content: "←";
    margin-right: 8px;
    font-size: 1.2em;
  }

  .page-header {
    margin-bottom: 30px;
  }

  .page-title {
    font-size: 2rem;
    font-weight: 700;
    margin: 0 0 10px 0;
    line-height: 1.2;
  }

  .page-subtitle {
    color: var(--wa-color-brand-50);
    font-size: 1.1rem;
    font-weight: 500;
    margin: 0;
  }

  .page-content {
    background: var(--app-bg-card);
    border-radius: 16px;
    padding: 26px 32px 10px;
    box-shadow: 0 2px 8px var(--app-shadow);
    margin: 20px 0;
  }

  .page-content h3 {
    margin-top: 24px;
    margin-bottom: 12px;
    font-size: 1.2rem;
    font-weight: 600;
  }

  .page-content ul,
  .page-content ol {
    margin: 8px 0;
    padding-left: 24px;
  }

  .page-content li {
    margin: 8px 0;
    line-height: 1.6;
  }

  .page-content p {
    margin: 12px 0;
    line-height: 1.6;
  }

  .page-content a {
    color: var(--wa-color-brand-50);
    text-decoration: none;
  }

  .page-content a:hover {
    text-decoration: underline;
  }

  .page-content code {
    background: var(--wa-color-neutral-95);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.9em;
  }

  .wa-dark .page-content code {
    background: var(--wa-color-neutral-10);
  }

  .installer-wrapper {
    max-width: 1200px;
    margin: 30px auto 0;
  }

  .installer-card {
    background: var(--app-bg-card);
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    margin: 20px 0;
  }

  .installer-card install-esphome-firmware,
  .installer-card install-esp-bridge-firmware {
    width: 100%;
    border: none;
    min-height: 600px;
    border-radius: 16px;
  }

  install-esphome-firmware .min-h-screen,
  install-esp-bridge-firmware .min-h-screen {
    min-height: auto !important;
  }

  .troubleshooting-container {
    max-width: 1200px;
    margin: 30px auto 0;
    display: none;
  }

  .troubleshooting-container.show {
    display: block;
  }

  .troubleshooting-card {
    background: var(--app-bg-card);
    border-radius: 16px;
    padding: 26px 32px 10px;
    box-shadow: 0 2px 8px var(--app-shadow);
    margin: 20px 0 30px;
  }

  .troubleshooting-card h3 {
    font-size: 1.2rem;
    font-weight: 600;
  }

  .troubleshooting-card p {
    margin: 12px 0;
    line-height: 1.6;
  }

  .troubleshooting-card ul,
  .troubleshooting-card ol {
    margin: 8px 0;
    padding-left: 24px;
  }

  .troubleshooting-card li {
    margin: 8px 0;
    line-height: 1.6;
  }

  .troubleshooting-card a {
    color: var(--wa-color-brand-50);
    text-decoration: none;
  }

  .troubleshooting-card a:hover {
    text-decoration: underline;
  }

  @media (max-width: 1200px) {
    .details-page,
    .installer-wrapper,
    .troubleshooting-container {
      padding: 0 20px;
    }
  }

  @media (max-width: 768px) {
    .page-title {
      font-size: 1.5rem;
    }

    .page-subtitle {
      font-size: 1rem;
    }

    .page-content {
      padding: 20px 20px 10px;
    }
  }
</style>

<div class="details-page">
  {% if backHref %}
  <a href="{{ backHref }}" class="back-link">Back</a>
  {% endif %}

  <div class="page-header">
    <h1 class="page-title">{{ title }}</h1>
    {% if subtitle %}
    <p class="page-subtitle">{{ subtitle }}</p>
    {% endif %}
  </div>

  {{ content }}
</div>
