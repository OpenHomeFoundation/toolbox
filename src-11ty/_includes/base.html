{% capture full_title -%} {%- if title -%} {{ title }} – Device Toolbox {%- else
-%} Device Toolbox {%- endif -%} {%- endcapture %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{{ full_title }}</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="description" content="{{ description }}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://early.webawesome.com/webawesome@3.0.0-beta.6/dist/styles/webawesome.css"
    />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body class="wa-palette-shoelace wa-theme-shoelace">
    <div class="app-header">
      <header>
        <a href="/" class="logo-section" aria-label="Device Toolbox Home">
          <picture>
            <source
              srcset="/ohf_dark.svg"
              media="(prefers-color-scheme: dark)"
            />
            <img
              src="/open-home-foundation.svg"
              alt="Open Home Foundation"
              class="logo"
            />
          </picture>
        </a>

        <nav class="nav-links">
          <a
            href="https://www.openhomefoundation.org/"
            class="nav-link"
            target="_blank"
          >
            OHF
          </a>
          <a
            href="https://www.home-assistant.io/"
            class="nav-link"
            target="_blank"
          >
            Home Assistant
          </a>
        </nav>
      </header>
    </div>
    {{ content }}
    <script>
      (function () {
        const updateTheme = () => {
          const prefersDark = window.matchMedia(
            '(prefers-color-scheme: dark)'
          ).matches;
          document.documentElement.classList.toggle('wa-dark', prefersDark);
          document.body.classList.toggle('wa-dark', prefersDark);
          document.body.classList.toggle('wa-light', !prefersDark);
        };

        updateTheme();
        window
          .matchMedia('(prefers-color-scheme: dark)')
          .addEventListener('change', updateTheme);
      })();
    </script>
  </body>
</html>
